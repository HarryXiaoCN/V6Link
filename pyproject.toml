[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v6link"
version = "0.3.0"
description = "V6Link — 端到端加密的 IPv6 点对点通讯工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "cryptography>=42",
    "psutil>=5.9",
]

[project.scripts]
v6link = "v6link.ui.app:main"

[tool.setuptools.packages.find]
include = ["v6link*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

