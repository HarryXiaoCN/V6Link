[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v6link"
version = "0.3.0"
description = "V6Link — 端到端加密的 IPv6 点对点通讯工具"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "HarryXiaoCN" }]
requires-python = ">=3.11"
keywords = ["ipv6", "p2p", "messaging", "file-transfer", "encryption", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Desktop Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking",
]
dependencies = [
    "PySide6>=6.7,<7",
    "cryptography>=42",
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/HarryXiaoCN/V6Link"
Repository = "https://github.com/HarryXiaoCN/V6Link"
Issues = "https://github.com/HarryXiaoCN/V6Link/issues"
Changelog = "https://github.com/HarryXiaoCN/V6Link/blob/main/CHANGELOG.md"

[project.scripts]
v6link = "v6link.ui.app:main"

[tool.setuptools.packages.find]
include = ["v6link*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

