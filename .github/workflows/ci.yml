name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Environment
        run: |
          python --version
          python -m pip --version
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cryptography>=42" "psutil>=5.9" ruff
      - name: Run core tests
        env:
          PYTHONPATH: .
          V6LINK_SKIP_E2E: "1"
        run: python -m unittest discover -s tests -v
      - name: Lint (syntax and undefined names)
        run: python -m ruff check v6link tests --select E9,F63,F7,F82

  ui-import:
    name: ui-import (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install UI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Import smoke test
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: python -c "from v6link.engine import ChatEngine, ProgressEmitter, _valid_announced_hosts; from v6link import runtime; import v6link.ui.main_window; print('imports ok')"
