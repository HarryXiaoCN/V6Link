name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff
      - name: Run unit tests
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Import smoke test
        if: runner.os == 'Windows'
        env:
          PYTHONPATH: .
        run: python -c "from v6link.engine import ChatEngine, ProgressEmitter, _valid_announced_hosts; from v6link import runtime; import v6link.ui.main_window; print('imports ok')"
      - name: Lint (syntax and undefined names)
        run: python -m ruff check v6link tests --select E9,F63,F7,F82
