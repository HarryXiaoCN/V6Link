name: Feature request
description: 建议一个新功能或改进
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明使用场景，而不只是解决方案。V6Link 的目标是「无中心服务器的 IPv6 直连通讯」，与这个目标冲突的功能（例如必须依赖云端账号）需要额外讨论。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 现在的工作方式哪里不舒服？谁会遇到这个问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 连接与网络
        - 文本消息
        - 文件传输
        - 好友与身份
        - 界面与体验
        - 版本更新
        - 打包与跨平台
        - 文档
        - 其他
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过已有 issue
          required: true
